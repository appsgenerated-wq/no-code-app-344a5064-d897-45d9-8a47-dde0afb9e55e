name: GorillaTracker

entities:
  User:
    authenticable: true
    properties:
      - name
      - name: email
        type: email
      - name: role
        type: choice
        options:
          values: [admin, researcher]
        default: researcher
    policies:
      create:
        - access: admin
      read:
        - access: restricted
          allow: User
          condition: self
      update:
        - access: restricted
          allow: User
          condition: self
      delete:
        - access: admin
      signup:
        - access: public

  Gorilla:
    properties:
      - name
      - name: species
        type: choice
        options:
          values: ["Mountain Gorilla", "Eastern Lowland Gorilla", "Western Lowland Gorilla", "Cross River Gorilla"]
      - name: bio
        type: text
      - name: dateOfBirth
        type: date
      - name: photo
        type: image
        options:
          sizes:
            thumbnail:
              width: 200
              height: 200
            large:
              width: 800
              height: 600
    policies:
      create:
        - access: admin
      read:
        - access: public
      update:
        - access: admin
      delete:
        - access: admin

  Observation:
    properties:
      - name: notes
        type: richText
      - name: observedAt
        type: timestamp
    belongsTo:
      - name: gorilla
        entity: Gorilla
      - name: observer
        entity: User
    policies:
      create:
        - access: restricted
          allow: User
      read:
        - access: public
      update:
        - access: restricted
          allow: User
          condition: self
      delete:
        - access: restricted
          allow: User
          condition: self


# Health check endpoint for connection testing
endpoints:
  health:
    path: /api/health
    method: GET
    policies: []
    handler: healthCheck